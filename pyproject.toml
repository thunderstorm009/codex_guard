[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "codexguard"
version = "0.1.0"
description = "Offline, read-only security auditing for OpenAI Codex CLI configuration"
requires-python = ">=3.9"
dependencies = ["tomli==2.5.0; python_version < '3.11'"]

[project.optional-dependencies]
test = [
    "pytest==9.0.3; python_version >= '3.10'",
]
dev = [
    "ruff==0.17.5; python_version >= '3.10'",
    "bandit==1.9.4; python_version >= '3.10'",
]

[project.scripts]
codexguard = "codexguard.cli:main"

[tool.flit.module]
name = "codexguard"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
