<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard seven-rule map</title><desc id="desc">Seven heuristic checks grouped into configuration, command, secret, and instruction review, with exact default severity for each.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1b2d49"/></linearGradient><style>.h{font:700 24px system-ui,sans-serif;fill:#f3f7ff}.cap{font:700 11px system-ui,sans-serif;letter-spacing:1px;fill:#7be0c7}.t{font:700 15px system-ui,sans-serif;fill:#f6f8fc}.s{font:400 12px system-ui,sans-serif;fill:#bac9dc}.card{fill:#1d3352;stroke:#38577b;stroke-width:1.3}.sevC{fill:#ff7777}.sevH{fill:#ffc074}.sevM{fill:#86bdff}.sevL{fill:#82dec0}.badge{font:700 11px system-ui,sans-serif;fill:#132035}</style></defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/><text x="48" y="52" class="h">Seven rules, four review areas</text><text x="48" y="78" class="s">Severity is rule metadata; findings are prompts for manual review, not proof of compromise.</text>
  <g transform="translate(48 112)">
    <rect width="260" height="128" rx="15" class="card"/><text x="20" y="28" class="cap">CONFIGURATION</text><text x="20" y="58" class="t">CG-001 · Sandbox</text><rect x="206" y="41" width="40" height="20" rx="10" class="sevC"/><text x="211" y="55" class="badge">CRIT</text><text x="20" y="83" class="s">Selected unrestricted values</text><text x="20" y="105" class="t">CG-002 · Approval</text><rect x="206" y="88" width="40" height="20" rx="10" class="sevL"/><text x="217" y="102" class="badge">LOW</text>
    <rect x="278" width="260" height="128" rx="15" class="card"/><text x="298" y="28" class="cap">INTEGRATIONS</text><text x="298" y="58" class="t">CG-003 · MCP command</text><rect x="476" y="41" width="40" height="20" rx="10" class="sevH"/><text x="482" y="55" class="badge">HIGH</text><text x="298" y="83" class="s">Shell / inline execution pattern</text><text x="298" y="108" class="t">CG-006 · Hooks</text><rect x="476" y="91" width="40" height="20" rx="10" class="sevL"/><text x="487" y="105" class="badge">LOW</text>
    <rect x="556" width="260" height="128" rx="15" class="card"/><text x="576" y="28" class="cap">ENVIRONMENT + SECRETS</text><text x="576" y="62" class="t">CG-004 · CODEX_HOME</text><rect x="754" y="45" width="50" height="20" rx="10" class="sevM"/><text x="760" y="59" class="badge">MED</text><text x="576" y="91" class="t">CG-005 · Secret pattern</text><rect x="754" y="74" width="50" height="20" rx="10" class="sevH"/><text x="760" y="88" class="badge">HIGH</text><text x="576" y="114" class="s">Common formats only; redacted evidence</text>
    <rect x="834" width="260" height="128" rx="15" class="card"/><text x="854" y="28" class="cap">PROJECT INSTRUCTIONS</text><text x="854" y="62" class="t">CG-007 · Phrase match</text><rect x="1032" y="45" width="50" height="20" rx="10" class="sevM"/><text x="1038" y="59" class="badge">MED</text><text x="854" y="91" class="s">Small selected phrase set in AGENTS.md</text><text x="854" y="114" class="s">Context can change interpretation</text>
  </g>
  <rect x="48" y="282" width="1094" height="112" rx="16" fill="#163d42" stroke="#32766f"/><text x="72" y="316" class="cap">SEVERITY CONTEXT</text><text x="72" y="344" class="t">CG-002 is LOW by default; same-file danger-full-access sandbox raises it to MEDIUM.</text><text x="72" y="371" class="s">Confidence describes pattern-match confidence, not exploitability. Rules can miss unsafe cases or flag benign configuration.</text>
</svg>
