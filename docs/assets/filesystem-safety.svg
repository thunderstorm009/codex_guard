<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard filesystem safety boundaries</title><desc id="desc">An explicit scan root contains bounded descriptor-relative traversal to selected regular files. Symlinks are not followed for scanned entries, limits cap reads and traversal, and optional report output is an external path with documented race limits.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1d304c"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#72b7ef"/></marker><style>.h{font:700 23px system-ui,sans-serif;fill:#f5f8ff}.t{font:700 15px system-ui,sans-serif;fill:#f3f7fc}.s{font:400 12px system-ui,sans-serif;fill:#becde0}.cap{font:700 11px system-ui,sans-serif;fill:#70dec5;letter-spacing:1px}.boundary{fill:#162a42;stroke:#5da8d5;stroke-width:2;stroke-dasharray:7 5}.box{fill:#1e3452;stroke:#3c5d82;stroke-width:1.4}.warn{fill:#4a3528;stroke:#bb8555}.line{stroke:#72b7ef;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="410" rx="24" fill="url(#bg)"/><text x="42" y="48" class="h">Filesystem boundary and limits</text>
  <rect x="48" y="88" width="702" height="260" rx="18" class="boundary"/><text x="72" y="118" class="cap">EXPLICIT SCAN ROOT · CONTENT IS UNTRUSTED DATA</text>
  <rect x="76" y="154" width="174" height="116" rx="14" class="box"/><text x="96" y="185" class="t">Pin root</text><text x="96" y="211" class="s">descriptor checks</text><text x="96" y="234" class="s">root identity check</text>
  <path d="M255 212H295" class="line"/><rect x="304" y="154" width="190" height="116" rx="14" class="box"/><text x="324" y="185" class="t">Walk directories</text><text x="324" y="211" class="s">dir_fd + no-follow</text><text x="324" y="234" class="s">skip symlink dirs</text>
  <path d="M499 212H539" class="line"/><rect x="548" y="154" width="174" height="116" rx="14" class="box"/><text x="568" y="185" class="t">Open candidates</text><text x="568" y="211" class="s">regular file check</text><text x="568" y="234" class="s">bounded read-only</text>
  <rect x="781" y="98" width="270" height="108" rx="14" class="warn"/><text x="803" y="130" class="cap">BOUNDED WORK</text><text x="803" y="157" class="t">1 MiB / file · depth 20</text><text x="803" y="181" class="s">5000 files · 50000 entries · 1000 dirs · 64 open dirs</text>
  <path d="M723 245C766 257 776 266 798 277" class="line"/><rect x="806" y="254" width="245" height="91" rx="14" class="box"/><text x="828" y="285" class="t">Optional report path</text><text x="828" y="310" class="s">outside root, exclusive create</text><text x="828" y="330" class="s">not a complete race guarantee</text>
  <text x="48" y="382" class="s">Platform support differs. These controls reduce risk; they cannot eliminate every same-user race or filesystem side effect such as atime updates.</text>
</svg>
