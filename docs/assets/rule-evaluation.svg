<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard rule evaluation and redaction</title><desc id="desc">Scanned TOML and text are parsed as inert data and routed to relevant rule evaluators. Matching evidence is redacted and added to a result; it is never executed.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1d304c"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#72b7ef"/></marker><style>.h{font:700 23px system-ui,sans-serif;fill:#f5f8ff}.t{font:700 15px system-ui,sans-serif;fill:#f3f7fc}.s{font:400 12px system-ui,sans-serif;fill:#becde0}.cap{font:700 11px system-ui,sans-serif;fill:#70dec5;letter-spacing:1px}.box{fill:#1e3452;stroke:#3c5d82;stroke-width:1.4}.green{fill:#164348;stroke:#39887f}.line{stroke:#72b7ef;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="370" rx="24" fill="url(#bg)"/><text x="44" y="48" class="h">Route data to rules, then redact evidence</text>
  <rect x="42" y="104" width="156" height="91" rx="14" class="box"/><text x="62" y="135" class="cap">INPUT A</text><text x="62" y="162" class="t">TOML bytes</text><text x="62" y="181" class="s">config.toml</text>
  <rect x="42" y="222" width="156" height="91" rx="14" class="box"/><text x="62" y="253" class="cap">INPUT B</text><text x="62" y="280" class="t">UTF-8 text</text><text x="62" y="299" class="s">AGENTS / examples</text>
  <path d="M203 150H250" class="line"/><path d="M203 267H250" class="line"/><rect x="258" y="104" width="176" height="91" rx="14" class="box"/><text x="278" y="135" class="cap">DECODE</text><text x="278" y="162" class="t">Parse TOML</text><text x="278" y="181" class="s">tomllib / tomli</text><rect x="258" y="222" width="176" height="91" rx="14" class="box"/><text x="278" y="253" class="cap">DECODE</text><text x="278" y="280" class="t">Decode text</text><text x="278" y="299" class="s">replacement errors</text>
  <path d="M439 150H486" class="line"/><path d="M439 267H486" class="line"/><rect x="494" y="90" width="210" height="112" rx="14" class="box"/><text x="514" y="121" class="cap">evaluate_config</text><text x="514" y="150" class="t">CG-001, 002, 003</text><text x="514" y="175" class="s">CG-005, CG-006</text><rect x="494" y="215" width="210" height="112" rx="14" class="box"/><text x="514" y="246" class="cap">evaluate_text</text><text x="514" y="275" class="t">CG-005</text><text x="514" y="300" class="s">CG-004 or CG-007 by file kind</text>
  <path d="M710 207H755" class="line"/><rect x="763" y="150" width="150" height="112" rx="14" class="green"/><text x="783" y="181" class="cap">REDACT</text><text x="783" y="210" class="t">Common forms</text><text x="783" y="234" class="s">heuristic patterns</text>
  <path d="M919 207H963" class="line"/><rect x="971" y="150" width="100" height="112" rx="14" class="box"/><text x="988" y="181" class="cap">RESULT</text><text x="988" y="210" class="t">Finding</text><text x="988" y="234" class="s">for review</text>
  <text x="44" y="350" class="s">Rules inspect values and strings; they do not launch configured commands, hooks, or MCP servers.</text>
</svg>
