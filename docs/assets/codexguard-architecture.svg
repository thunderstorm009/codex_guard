<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard software architecture</title><desc id="desc">CLI sends the explicit root to scanner; scanner routes TOML to config parser and text to text decoder; both flow through rules and redaction to a scan result, then reporter outputs terminal formats or an optional external report.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1b2e4b"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74b7f2"/></marker><style>.h{font:700 24px system-ui,sans-serif;fill:#f3f7ff}.t{font:700 15px system-ui,sans-serif;fill:#f4f8ff}.s{font:400 12px system-ui,sans-serif;fill:#b9c9df}.box{fill:#1e3455;stroke:#3c5d83;stroke-width:1.5}.green{fill:#164348;stroke:#398b83}.blue{fill:#19364c;stroke:#3c7088}.line{stroke:#74b7f2;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#62839e;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style></defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/><text x="48" y="52" class="h">CodexGuard module map</text><text x="48" y="78" class="s">Data flows left to right; scan target content is never treated as executable behavior.</text>
  <rect x="48" y="198" width="150" height="92" rx="14" class="box"/><text x="70" y="233" class="t">CLI</text><text x="70" y="257" class="s">cli.py · options</text><text x="70" y="276" class="s">exit status</text>
  <path d="M202 244H242" class="line"/><rect x="250" y="178" width="176" height="132" rx="14" class="box"/><text x="270" y="212" class="t">Scanner</text><text x="270" y="237" class="s">scanner.py</text><text x="270" y="258" class="s">descriptor traversal</text><text x="270" y="279" class="s">resource bounds</text>
  <path d="M430 210H474" class="line"/><path d="M430 278H474" class="line"/><rect x="482" y="142" width="172" height="78" rx="14" class="blue"/><text x="502" y="174" class="t">TOML parser</text><text x="502" y="198" class="s">config_parser.py</text><rect x="482" y="246" width="172" height="78" rx="14" class="blue"/><text x="502" y="278" class="t">Text decode</text><text x="502" y="302" class="s">UTF-8 replacement</text>
  <path d="M658 182H710" class="line"/><path d="M658 285H710" class="line"/><rect x="718" y="178" width="156" height="132" rx="14" class="box"/><text x="738" y="212" class="t">Rules</text><text x="738" y="237" class="s">rules.py</text><text x="738" y="258" class="s">7 heuristic checks</text><text x="738" y="279" class="s">secret redaction</text>
  <path d="M878 244H918" class="line"/><rect x="926" y="178" width="126" height="132" rx="14" class="green"/><text x="946" y="212" class="t">Result</text><text x="946" y="237" class="s">ScanResult</text><text x="946" y="258" class="s">findings + errors</text><text x="946" y="279" class="s">counts + limits</text>
  <path d="M1056 244H1080" class="line"/><rect x="1087" y="164" width="82" height="160" rx="14" class="box"/><text x="1101" y="202" class="t">Report</text><text x="1101" y="228" class="s">reporter</text><text x="1101" y="256" class="s">text</text><text x="1101" y="277" class="s">JSON</text><text x="1101" y="298" class="s">MD / file</text>
  <rect x="250" y="365" width="176" height="70" rx="12" class="green"/><text x="270" y="394" class="t">constants.py</text><text x="270" y="417" class="s">Formats · severity · bounds</text><path d="M338 360V314" class="dash"/>
  <rect x="482" y="365" width="172" height="70" rx="12" class="green"/><text x="502" y="394" class="t">Rule catalog</text><text x="502" y="417" class="s">security_rules.json</text><path d="M568 360V329" class="dash"/>
  <text x="48" y="474" class="s">Optional report writes use exclusive creation outside the scan root; destination races remain a documented limitation.</text>
</svg>
