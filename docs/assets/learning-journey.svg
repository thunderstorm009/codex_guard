<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Seven-module CodexGuard learning path</title>
  <desc id="desc">The sequence is Claude Code fundamentals, agentic engineering, Docker concepts, AWS basics, Docker Compose, GitHub Actions with Docker, and AWS networking. The first two are marked completed; the remaining five are in progress according to the learner status supplied for the project.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1b2d49"/></linearGradient><linearGradient id="path" x1="0" x2="1"><stop stop-color="#37cba9"/><stop offset="1" stop-color="#64a9ff"/></linearGradient><style>.h{font:700 24px system-ui,sans-serif;fill:#f3f7ff}.s{font:400 12px system-ui,sans-serif;fill:#b9c9dd}.t{font:700 13px system-ui,sans-serif;fill:#f3f7ff}.cap{font:700 10px system-ui,sans-serif;letter-spacing:.8px;fill:#70dec5}.node{fill:#55d5b6;stroke:#163d48;stroke-width:3}.node2{fill:#79b5ff;stroke:#253c61;stroke-width:3}.card{fill:#1e3454;stroke:#3a597d;stroke-width:1.2}.done{font:700 10px system-ui,sans-serif;fill:#80e3c8}.prog{font:700 10px system-ui,sans-serif;fill:#91bfff}</style></defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/><text x="42" y="48" class="h">Seven modules · one engineering journey</text><text x="42" y="73" class="s">From agent context to local/cloud boundaries and the CodexGuard implementation.</text>
  <path d="M82 188H1117" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/>
  <g>
    <circle cx="82" cy="188" r="17" class="node"/><text x="77" y="193" class="t">1</text><rect x="30" y="222" width="150" height="100" rx="13" class="card"/><text x="44" y="247" class="cap">COMPLETED</text><text x="44" y="272" class="t">Claude Code</text><text x="44" y="292" class="s">Fundamentals</text>
    <circle cx="254" cy="188" r="17" class="node"/><text x="249" y="193" class="t">2</text><rect x="196" y="92" width="150" height="78" rx="13" class="card"/><text x="210" y="117" class="cap">COMPLETED</text><text x="210" y="143" class="t">Agentic</text><text x="210" y="160" class="s">Engineering</text>
    <circle cx="426" cy="188" r="17" class="node2"/><text x="421" y="193" class="t">3</text><rect x="354" y="222" width="170" height="100" rx="13" class="card"/><text x="368" y="247" class="prog">IN PROGRESS</text><text x="368" y="272" class="t">Basic Docker</text><text x="368" y="292" class="s">Concepts</text>
    <circle cx="598" cy="188" r="17" class="node2"/><text x="593" y="193" class="t">4</text><rect x="535" y="92" width="150" height="78" rx="13" class="card"/><text x="549" y="117" class="prog">IN PROGRESS</text><text x="549" y="144" class="t">AWS Basics</text>
    <circle cx="770" cy="188" r="17" class="node2"/><text x="765" y="193" class="t">5</text><rect x="698" y="222" width="166" height="100" rx="13" class="card"/><text x="712" y="247" class="prog">IN PROGRESS</text><text x="712" y="272" class="t">Docker</text><text x="712" y="292" class="s">Compose</text>
    <circle cx="942" cy="188" r="17" class="node2"/><text x="937" y="193" class="t">6</text><rect x="862" y="92" width="180" height="78" rx="13" class="card"/><text x="876" y="117" class="prog">IN PROGRESS</text><text x="876" y="144" class="t">Actions + Docker</text>
    <circle cx="1114" cy="188" r="17" class="node2"/><text x="1109" y="193" class="t">7</text><rect x="1048" y="222" width="132" height="100" rx="13" class="card"/><text x="1061" y="247" class="prog">IN PROGRESS</text><text x="1061" y="272" class="t">AWS</text><text x="1061" y="292" class="s">Networking</text>
  </g>
  <text x="42" y="368" class="s">Statuses reflect the learner status supplied with this project brief; they do not imply module certification.</text>
</svg>
