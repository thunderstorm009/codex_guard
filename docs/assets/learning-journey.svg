<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard learning journey</title><desc id="desc">Five stages: coding-agent fundamentals, agentic engineering, Docker concepts, container hardening, and tracing the audit pipeline, ending in a human-reviewed security report.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1b2d49"/></linearGradient><linearGradient id="path" x1="0" x2="1"><stop stop-color="#37cba9"/><stop offset="1" stop-color="#64a9ff"/></linearGradient><style>.h{font:700 24px system-ui,sans-serif;fill:#f3f7ff}.cap{font:700 11px system-ui,sans-serif;letter-spacing:1px;fill:#72dfc5}.t{font:700 15px system-ui,sans-serif;fill:#f3f7ff}.s{font:400 12px system-ui,sans-serif;fill:#b9c9dd}.card{fill:#1e3454;stroke:#3a597d;stroke-width:1.3}.num{font:700 14px system-ui,sans-serif;fill:#12243b}</style></defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/><text x="48" y="52" class="h">Learn the concepts. Trace the implementation.</text><text x="48" y="78" class="s">A practical path from agent context and permissions to a bounded audit pipeline.</text>
  <path d="M112 190H1079" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/>
  <g>
    <circle cx="112" cy="190" r="18" fill="#55d5b6"/><text x="108" y="195" class="num">1</text><rect x="48" y="222" width="190" height="100" rx="14" class="card"/><text x="66" y="252" class="cap">FOUNDATION</text><text x="66" y="277" class="t">Agent basics</text><text x="66" y="300" class="s">Context • tools • trust</text>
    <circle cx="350" cy="190" r="18" fill="#59d1b7"/><text x="346" y="195" class="num">2</text><rect x="255" y="92" width="190" height="76" rx="14" class="card"/><text x="273" y="120" class="cap">WORKFLOW</text><text x="273" y="146" class="t">Agentic engineering</text>
    <circle cx="588" cy="190" r="18" fill="#5bc3c3"/><text x="584" y="195" class="num">3</text><rect x="493" y="222" width="190" height="100" rx="14" class="card"/><text x="511" y="252" class="cap">PACKAGING</text><text x="511" y="277" class="t">Docker concepts</text><text x="511" y="300" class="s">Image • user • mounts</text>
    <circle cx="826" cy="190" r="18" fill="#5eafd8"/><text x="822" y="195" class="num">4</text><rect x="731" y="92" width="190" height="76" rx="14" class="card"/><text x="749" y="120" class="cap">BOUNDARIES</text><text x="749" y="146" class="t">Container hardening</text>
    <circle cx="1064" cy="190" r="18" fill="#69aaff"/><text x="1060" y="195" class="num">5</text><rect x="969" y="222" width="190" height="100" rx="14" class="card"/><text x="987" y="252" class="cap">APPLICATION</text><text x="987" y="277" class="t">Audit pipeline</text><text x="987" y="300" class="s">Rules • redaction • report</text>
  </g>
  <text x="48" y="360" class="s">Finish by mapping each concept to source code, test intent, and one limitation.</text>
</svg>
