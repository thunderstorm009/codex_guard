<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual AWS VPC networking boundaries</title><desc id="desc">A VPC contains public and private subnets with separate route tables. Internet gateway connects the public subnet; a NAT gateway in the public subnet can provide outbound-only path for private subnet instances. Security groups filter traffic. This is conceptual, not CodexGuard infrastructure.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1b304d"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#72b7ef"/></marker><style>.h{font:700 23px system-ui,sans-serif;fill:#f5f8ff}.t{font:700 14px system-ui,sans-serif;fill:#f3f7fc}.s{font:400 12px system-ui,sans-serif;fill:#becde0}.cap{font:700 10px system-ui,sans-serif;fill:#70dec5;letter-spacing:.8px}.vpc{fill:#162b43;stroke:#568eb6;stroke-width:1.8;stroke-dasharray:7 5}.sub{fill:#1c3452;stroke:#3d6084;stroke-width:1.3}.gate{fill:#164348;stroke:#39887f;stroke-width:1.3}.line{stroke:#72b7ef;stroke-width:2;fill:none;marker-end:url(#a)}.egress{stroke:#dfb36c;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="390" rx="24" fill="url(#bg)"/><text x="42" y="48" class="h">Conceptual VPC routing and isolation</text>
  <rect x="38" y="80" width="1024" height="265" rx="19" class="vpc"/><text x="62" y="109" class="cap">AWS VPC · CONCEPTUAL ONLY</text>
  <rect x="67" y="143" width="240" height="158" rx="15" class="sub"/><text x="88" y="174" class="cap">PUBLIC SUBNET</text><text x="88" y="203" class="t">Route table → IGW</text><text x="88" y="230" class="s">Optional controlled ingress</text><text x="88" y="254" class="s">Bastion or NAT placement</text>
  <rect x="408" y="143" width="240" height="158" rx="15" class="sub"/><text x="429" y="174" class="cap">PRIVATE SUBNET</text><text x="429" y="203" class="t">Route table → NAT</text><text x="429" y="230" class="s">No direct IGW route</text><text x="429" y="254" class="s">Outbound path may exist</text>
  <rect x="756" y="142" width="119" height="66" rx="13" class="gate"/><text x="778" y="170" class="t">Internet</text><text x="778" y="190" class="s">Gateway</text>
  <rect x="756" y="236" width="119" height="66" rx="13" class="gate"/><text x="778" y="264" class="t">NAT</text><text x="778" y="284" class="s">Gateway</text>
  <rect x="908" y="190" width="128" height="76" rx="13" class="gate"/><text x="928" y="220" class="t">Security</text><text x="928" y="242" class="s">groups filter</text>
  <path d="M312 180H398" class="line"/><path d="M656 267H746" class="egress"/><path d="M875 269H900" class="egress"/><path d="M307 232H746V176H748" class="line"/>
  <text x="42" y="371" class="s">Routes, addresses, security groups, network ACLs, and host controls jointly determine reachability; CodexGuard does not deploy this design.</text>
</svg>
