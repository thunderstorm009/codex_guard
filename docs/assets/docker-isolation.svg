<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard Docker isolation architecture</title><desc id="desc">A host Docker daemon runs CodexGuard as UID 10001 in a read-only root container, without networking and with dropped capabilities, no-new-privileges and resource caps. The host scan is mounted read-only and reports are mounted separately writable.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1c304c"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#72b7ef"/></marker><style>.h{font:700 23px system-ui,sans-serif;fill:#f5f8ff}.t{font:700 15px system-ui,sans-serif;fill:#f3f7fc}.s{font:400 12px system-ui,sans-serif;fill:#becde0}.cap{font:700 11px system-ui,sans-serif;fill:#70dec5;letter-spacing:1px}.host{fill:#16283e;stroke:#5e9bc2;stroke-width:1.8;stroke-dasharray:7 5}.container{fill:#173e43;stroke:#4aa59a;stroke-width:1.8}.box{fill:#203755;stroke:#45658a;stroke-width:1.3}.line{stroke:#72b7ef;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#dbac68;stroke-width:2;stroke-dasharray:6 5}</style></defs>
  <rect width="1100" height="440" rx="24" fill="url(#bg)"/><text x="44" y="48" class="h">Restricted CodexGuard container run</text>
  <rect x="43" y="86" width="1014" height="286" rx="20" class="host"/><text x="68" y="117" class="cap">HOST / DOCKER DAEMON BOUNDARY</text>
  <rect x="74" y="154" width="210" height="130" rx="14" class="box"/><text x="94" y="187" class="t">Scan repository</text><text x="94" y="214" class="s">host fixture directory</text><text x="94" y="239" class="s">bind-mounted as /scan:ro</text>
  <path d="M290 218H350" class="line"/>
  <rect x="360" y="136" width="410" height="174" rx="18" class="container"/><text x="385" y="168" class="cap">CONTAINER · RESTRICTED AT RUN TIME</text><text x="385" y="198" class="t">CodexGuard process · UID/GID 10001</text><text x="385" y="225" class="s">root filesystem read-only · network none</text><text x="385" y="250" class="s">all capabilities dropped · no-new-privileges</text><text x="385" y="275" class="s">256 MiB · 1 CPU · 64 PIDs (example)</text>
  <path d="M777 218H832" class="line"/>
  <rect x="841" y="154" width="188" height="130" rx="14" class="box"/><text x="861" y="187" class="t">Report directory</text><text x="861" y="214" class="s">host mount at /reports</text><text x="861" y="239" class="s">writable by container UID</text>
  <path d="M564 316V340" class="dash"/><text x="398" y="358" class="s">Docker daemon, kernel, and host mounts remain part of the trusted computing base.</text>
  <text x="44" y="412" class="s">The image sets UID 10001; the command supplies most other controls. Runtime isolation is not a guarantee of complete safety.</text>
</svg>
