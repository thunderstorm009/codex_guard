<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard overview</title>
  <desc id="desc">CodexGuard reviews selected repository configuration and instructions as inert local data, then returns redacted heuristic findings for a person to review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#182b4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#44d7b6"/><stop offset="1" stop-color="#63a8ff"/></linearGradient>
    <style>.h{font:700 32px system-ui,sans-serif;fill:#f5f8ff}.sub{font:400 17px system-ui,sans-serif;fill:#bac9df}.card{fill:#1e3152;stroke:#395477;stroke-width:1.5}.ct{font:700 18px system-ui,sans-serif;fill:#f1f5fc}.body{font:400 14px system-ui,sans-serif;fill:#b8c7dc}.cap{font:700 12px system-ui,sans-serif;letter-spacing:1.4px;fill:#6fe1c7}.arrow{stroke:#75baf9;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#75baf9"/></marker>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <circle cx="1090" cy="38" r="120" fill="#245374" opacity=".18"/><circle cx="70" cy="400" r="130" fill="#27b99e" opacity=".08"/>
  <text x="56" y="66" class="cap">OFFLINE • READ-ONLY • HUMAN-REVIEWED</text>
  <text x="56" y="116" class="h">Audit before the agent acts.</text>
  <text x="56" y="148" class="sub">A bounded local review of selected agent-facing files — not a safety guarantee.</text>
  <rect x="56" y="198" width="220" height="142" rx="18" class="card"/><text x="80" y="232" class="cap">INPUT</text><text x="80" y="265" class="ct">Repository files</text><text x="80" y="293" class="body">Instructions • TOML</text><text x="80" y="316" class="body">Environment examples</text>
  <path d="M290 269H365" class="arrow"/>
  <rect x="382" y="198" width="250" height="142" rx="18" class="card"/><text x="406" y="232" class="cap">INSPECT</text><text x="406" y="265" class="ct">Bounded scanner</text><text x="406" y="293" class="body">Parse as data • apply rules</text><text x="406" y="316" class="body">Redact common secret patterns</text>
  <path d="M646 269H720" class="arrow"/>
  <rect x="737" y="198" width="190" height="142" rx="18" class="card"/><text x="761" y="232" class="cap">OUTPUT</text><text x="761" y="265" class="ct">Report</text><text x="761" y="293" class="body">Text • JSON</text><text x="761" y="316" class="body">Markdown</text>
  <path d="M941 269H1001" class="arrow"/>
  <rect x="1018" y="198" width="126" height="142" rx="18" fill="#163d49" stroke="#3d8d82" stroke-width="1.5"/><text x="1042" y="232" class="cap">NEXT</text><text x="1042" y="265" class="ct">Human</text><text x="1042" y="293" class="body">Review</text><text x="1042" y="316" class="body">context</text>
  <text x="56" y="384" class="body">No target commands, hooks, scripts, MCP servers, or instructions are executed by the scan path.</text>
</svg>
