<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
  <title id="title">CodexGuard CLI and report workflow</title><desc id="desc">CLI parses scan arguments, invokes scanner, filters by severity, renders text, JSON or Markdown, optionally writes a new external report, prints unless quiet, and returns exit code based on findings or error.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a32"/><stop offset="1" stop-color="#1d304c"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#72b7ef"/></marker><style>.h{font:700 23px system-ui,sans-serif;fill:#f5f8ff}.t{font:700 15px system-ui,sans-serif;fill:#f3f7fc}.s{font:400 12px system-ui,sans-serif;fill:#becde0}.box{fill:#1e3452;stroke:#3c5d82;stroke-width:1.4}.green{fill:#164348;stroke:#39887f}.line{stroke:#72b7ef;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="350" rx="24" fill="url(#bg)"/><text x="44" y="48" class="h">CLI control and report flow</text>
  <rect x="43" y="119" width="151" height="99" rx="14" class="box"/><text x="63" y="153" class="t">Arguments</text><text x="63" y="178" class="s">scan / format</text><text x="63" y="198" class="s">severity / output</text>
  <path d="M200 169H242" class="line"/><rect x="250" y="119" width="151" height="99" rx="14" class="box"/><text x="270" y="153" class="t">scan(root)</text><text x="270" y="178" class="s">findings + errors</text><text x="270" y="198" class="s">counters + limits</text>
  <path d="M407 169H449" class="line"/><rect x="457" y="119" width="151" height="99" rx="14" class="box"/><text x="477" y="153" class="t">Filter</text><text x="477" y="178" class="s">minimum severity</text><text x="477" y="198" class="s">default: all</text>
  <path d="M614 169H656" class="line"/><rect x="664" y="119" width="151" height="99" rx="14" class="box"/><text x="684" y="153" class="t">Render</text><text x="684" y="178" class="s">text / JSON</text><text x="684" y="198" class="s">Markdown</text>
  <path d="M821 169H863" class="line"/><rect x="871" y="119" width="184" height="99" rx="14" class="green"/><text x="891" y="153" class="t">Output + status</text><text x="891" y="178" class="s">stdout or new external file</text><text x="891" y="198" class="s">exit 0 / 1 / 2 / 3</text>
  <text x="44" y="272" class="s">--quiet suppresses stdout; --output is optional, outside the scan root, and refuses existing destinations.</text>
  <text x="44" y="297" class="s">Exit 1 means qualifying findings. It does not block an agent or automatically remediate anything.</text>
</svg>
